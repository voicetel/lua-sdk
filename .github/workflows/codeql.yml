name: CodeQL

# CodeQL does not ship a Lua language pack
# (https://github.com/github/codeql-action/blob/main/src/languages/builtin.json).
# We still get real value from scanning the workflow files themselves —
# environment-injection bugs, unsafe action-version pinning, etc. —
# via the `actions` language pack. Lua source SAST is covered
# separately by luacheck in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '13 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
